version: '3.8'

services:
  spendwise-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spendwise-ai
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - JWT_SECRET=spendwise_production_super_secret_key_2026
      # - GOOGLE_CLIENT_ID=your_google_client_id_here
      # - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      # Persist the file-backed JSON database across container restarts
      - spendwise_data:/app/server/data

volumes:
  spendwise_data:
    driver: local

